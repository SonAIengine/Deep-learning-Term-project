[project]
name = "grokking-circuits"
version = "0.1.0"
description = "Mechanistic Interpretability: Grokking circuits + Code Variable Binding (IOI comparison)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4,<2.6",
    "transformer-lens>=2.0",
    "transformers>=4.40,<5.0",
    "datasets>=2.20",
    "einops>=0.8",
    "jaxtyping>=0.2.30",
    "wandb>=0.18",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "tqdm>=4.66",
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "scipy>=1.15.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grokking", "src/binding", "src/viz"]
